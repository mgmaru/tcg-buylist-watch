name: fetch

# 定期実行は止めている。カードラッシュが GitHub のサーバーからの接続を拒否するため。
# 再開するときは、下の schedule のコメントを外す。
on:
  # schedule:
  #   - cron: "17 20 * * *" # 毎日 5:17（日本時間）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Fetch
        id: fetch
        continue-on-error: true
        run: python -m buylist_watch fetch
      - name: Compare
        continue-on-error: true
        run: python -m buylist_watch compare
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date +%F) の買取表"
          git push
      - name: Build site
        run: python -m buylist_watch site --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Report a failed source
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "取得に失敗した店があります。Fetch のログを確認してください"
          exit 1

  deploy:
    needs: fetch
    if: always() && needs.fetch.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
